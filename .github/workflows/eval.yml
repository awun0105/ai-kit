name: Golden-set evaluation

# The full evaluation calls real models, so it runs nightly, on demand, and on pull
# requests labelled "run-eval" (the offline retrieval gate runs on every PR inside CI).
on:
  schedule:
    - cron: "0 19 * * *" # 02:00 Asia/Ho_Chi_Minh
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

jobs:
  eval:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-eval')
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EVALUATION_API_KEY: ${{ secrets.EVALUATION_API_KEY || secrets.OPENAI_API_KEY }}
      EVALUATION_LLM: ${{ vars.EVALUATION_LLM || 'gpt-5' }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'ci-only-not-a-secret-0123456789abcdef0123' }}
      LANGFUSE_TRACING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - name: Evaluate (fails when a gate fails)
        run: uv run python -m scripts.eval_rag --out reports
      - name: Publish the report to the run summary
        if: always()
        run: cat reports/eval-*.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: reports/
